<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Création</title>
<style>
  :root { --bg:#0d1420; --card:#151e2c; --fg:#e8edf5; --muted:#8b97a8; --accent:#4a90d9; --gold:#f5b342; --red:#e5534b; --pad:#ecedf0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:none; overscroll-behavior:none; }
  /* En haut, une bande vide : le launcher y pose son bandeau « verrouillé · [ unlock ] » quand la page a la main. */
  #app { display:flex; flex-direction:column; gap:8px; height:100%; padding:100px 10px 10px; }
  .row { display:flex; gap:6px; align-items:center; }
  .pill { border:0; border-radius:13px; padding:7px 11px; font:600 13px system-ui; color:var(--fg); background:rgba(255,255,255,.09); white-space:nowrap; }
  .pill.on { background:rgba(74,144,217,.45); }
  .grow { flex:1; min-width:0; }
  .scroller { display:flex; gap:5px; overflow-x:auto; touch-action:pan-x; scrollbar-width:none; min-width:0; }
  .scroller::-webkit-scrollbar { display:none; }
  .vars .pill { font-size:13px; padding:7px 10px; } .vars .pill.on { background:rgba(245,179,66,.45); }
  .card { border-radius:16px; padding:9px 10px; display:flex; flex-direction:column; gap:7px; }
  .solo { background:rgba(74,144,217,.10); border:1px solid rgba(74,144,217,.55); flex:1; min-height:0; }
  .acc { background:rgba(245,179,66,.08); border:1px solid rgba(245,179,66,.55); }
  .tag { font:800 12px system-ui; letter-spacing:1.2px; }
  .title { font:600 13px system-ui; color:var(--fg); opacity:.9; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chips { display:flex; gap:5px; flex-wrap:wrap; }
  .chips .pill { font-size:12px; padding:6px 10px; }
  #pads { flex:1; display:flex; flex-direction:column; gap:6px; min-height:0; }
  .prow { flex:1; display:flex; gap:4px; min-height:0; }
  .p { flex:1; border-radius:10px; background:var(--pad); color:#1c1c1e; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding-bottom:10px; transition:filter .05s; }
  .p b { font-size:14px; } .p i { font-style:normal; font-size:11px; opacity:.65; font-weight:600; }
  .p.ch { background:var(--gold); } .p.av { background:#a94a4d; color:#fff; } .p.down { background:var(--accent); color:#fff; }
  .chords { display:grid; grid-template-columns:repeat(12,1fr); gap:6px; }
  .c { grid-column:span 3; height:66px; border-radius:14px; background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.08); display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .c.r2 { grid-column:span 4; }
  .c small { font:700 11px system-ui; color:var(--accent); } .c.i0 small { color:var(--gold); }
  .c b { font:700 16px system-ui; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:96%; }
  .c b.long { font-size:12px; }
  .c.on { background:rgba(74,144,217,.55); } .c.on small { color:#fff; }
  .c.nx { border:2px solid rgba(245,179,66,.9); }
  input[type=range] { flex:1; accent-color:var(--accent); }
  .lbl { font-size:11px; color:var(--muted); }
  .over, #over { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-start; justify-content:center; padding-top:60px; z-index:5; }
  .over .box, #over .box { background:var(--card); border-radius:16px; padding:14px; width:calc(100% - 40px); display:flex; flex-direction:column; gap:8px; }
  #start { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(13,20,32,.85); z-index:9; font:700 18px system-ui; }
</style>
</head>
<body>
<div id="app">
  <div class="row">
    <button class="pill on" id="keyBtn"></button>
    <span id="stacks" class="scroller grow"></span>
  </div>
  <div class="card solo">
    <div class="row">
      <span class="tag" style="color:var(--accent)">SOLO</span>
      <span class="title grow" id="scaleTitle"></span>
      <button class="pill" id="tSolo"></button>
      <button class="pill" id="octDn">−</button>
      <span class="lbl" id="octLbl"></span>
      <button class="pill" id="octUp">+</button>
    </div>
    <div class="chips" id="scales"></div>
    <div id="pads"></div>
  </div>
  <div class="card acc">
    <div class="row">
      <span class="tag" style="color:var(--gold)">ACCORDS</span>
      <span class="title grow" id="chordTitle"></span>
      <button class="pill" id="hold"></button>
      <button class="pill" id="tPad"></button>
      <button class="pill" id="stop">⏹</button>
    </div>
    <div class="row" id="tabs"></div>
    <div class="scroller vars" id="vars"></div>
    <div class="chords" id="chords"></div>
  </div>
  <div class="row">
    <span class="lbl">Accords</span><input type="range" id="vPad" min="0" max="100">
    <span class="lbl">Solo</span><input type="range" id="vSolo" min="0" max="100">
  </div>
</div>
<div id="over"><div class="box">
  <div class="lbl">Tonalité</div><div class="chips" id="keys"></div>
  <div class="lbl">Mode</div><div class="chips" id="modes"></div>
</div></div>
<div id="sounds" class="over"><div class="box" style="max-height:80vh;overflow-y:auto;touch-action:pan-y">
  <div class="row"><b id="soundTitle" class="grow"></b><button class="pill on" id="soundOk">OK</button></div>
  <div id="soundList" style="display:flex;flex-direction:column;gap:6px"></div>
</div></div>
<div id="start">Touche pour commencer</div>

const Q = new URLSearchParams(location.search);
if (Q.has("root")) { S.root = (+Q.get("root") % 12 + 12) % 12; S.rootL = Q.has("l") ? +Q.get("l") % 7 : keyL[S.root]; }

const SUITE = (Q.get("suite") || "").split("-").map(x => x.split(".")).filter(x => x.length >= 3 && D.types[x[2]]).map(x => ({ pc: +x[0] % 12, l: +x[1] % 7, t: x[2] }));

const keyL = [0, 1, 1, 2, 2, 3, 3, 4, 5, 5, 6, 6];
const NUM = ["I", "II", "III", "IV", "V", "VI", "VII"];
const MAJ = [0, 2, 4, 5, 7, 9, 11];
const TENS = ["1", "♭9", "9", "♯9", "3", "11", "♯11", "5", "♭13", "13", "♭7", "7"];
const NEXT_MAJ = [[5, 7, 9, 2], [], [7, 5, 11], [], [9, 5], [7, 0, 2], [], [0, 9, 5], [], [2, 5, 7, 4], [], [0, 4]];

const sp = D.spell;
const mode = () => D.modes.find(m => m.id === S.mode) || D.modes[0];
function keyScale() { const iv = mode().iv; return iv.map((x, i) => ({ pc: (S.root + x) % 12, l: (S.rootL + i) % 7 })); }
function nameOf(pc) { const ks = keyScale(); const k = ks.find(n => n.pc === pc); return k ? sp[k.l][pc] : sp[keyL[pc]][pc]; }
// La qualité d'un type d'accord, d'après ses notes, pour proposer ses couleurs.
function qualOf(t) {
  const st = new Set(D.types[t].tones.map(x => x[0] % 12)), h = k => st.has(k);
  return h(4) && h(10) ? "dom" : h(4) && h(8) && !h(7) ? "aug" : h(4) ? "maj" : h(3) && h(6) && h(10) ? "hdim" : h(3) && h(6) ? "dim" : h(3) ? "min" : h(10) ? "dom" : "maj";
}
function chords() {
  if (S.tab === "suite" && SUITE.length) return SUITE.map((c, k) => ({ i: k, pc: c.pc, l: c.l, t: c.t, acc: 0, q: qualOf(c.t), lab: `${k + 1}` }));
  const m = mode(), iv = m.iv;
  return iv.map((x, i) => {
    const t = m.stacks[S.stack][i];
    const acc = x - MAJ[i];
    const t3 = (iv[(i + 2) % 7] - x + 12) % 12, t5 = (iv[(i + 4) % 7] - x + 12) % 12, t7 = (iv[(i + 6) % 7] - x + 12) % 12;
    // La qualité du degré (pour ses couleurs) : majeur, mineur, dominante, demi-diminué, diminué, augmenté.
    const q = t3 === 4 && t5 === 7 ? (t7 === 10 ? "dom" : "maj") : t3 === 3 && t5 === 7 ? "min" : t3 === 3 && t5 === 6 ? (t7 === 10 ? "hdim" : "dim") : t3 === 4 && t5 === 8 ? "aug" : "maj";
    return { i, pc: (S.root + x) % 12, l: (S.rootL + i) % 7, t, acc, minor: t3 === 3, q, lab: (acc === -1 ? "♭" : acc === 1 ? "♯" : "") + (t3 === 3 ? NUM[i].toLowerCase() : NUM[i]) };
  });
}
function chordPcs(c) { return [...new Set(D.types[c.t].tones.map(x => (c.pc + x[0]) % 12))]; }
function scaleCands() {
  if (!cur) return [];
  const pcs = chordPcs(cur), keyPcs = keyScale().map(n => n.pc), sug = D.types[cur.t].sug;
  const out = [];
  for (let sh = 0; sh < 12; sh++) for (const g of D.gscales) {
    const t = (cur.pc + sh) % 12;
    if (!pcs.every(p => g.mask[(p - t + 12) % 12] === 1)) continue;
    let score = -g.n + (sh === 0 ? 4 + (g.i === sug ? 12 : 0) : 0);
    for (let i = 0; i < 12; i++) if (g.mask[(i - t + 12) % 12] === 1 && keyPcs.includes(i)) score += 3;
    out.push({ g, t, sh, score });
  }
  return out.sort((a, b) => b.score - a.score).slice(0, 4);
}

const hz = m => 440 * Math.pow(2, (m - 69) / 12);

// ------------------------------------------------------------------ la banque de sons
// Chaque son : des oscillateurs (forme, rapport de fréquence, désaccord en cents, niveau), une modulation de fréquence
// facultative (fm : rapport, indice, déclin), un filtre passe-bas qui s'ouvre et se referme (lp), ou des formants (bp,
// pour les voix), une enveloppe (a, d, s, r en secondes ; s = niveau tenu), un vibrato (vib : vitesse, cents, retard),
// un trémolo (trem), et un niveau. Tous doux par défaut : filtres bas, attaques sans clic.
const SOUNDS = {
  carre:    { name: "Carré doux",       cat: "Synthé", osc: [["square", 1, 0, .35], ["sine", 1, 0, .6]], lp: [3.2, 2600, .3], amp: [.008, .3, .8, .12], vib: [5.2, 12, .4], lvl: .5 },
  cordes:   { name: "Cordes douces",    cat: "Cordes", osc: [["sawtooth", 1, -7, .33], ["sawtooth", 1, 0, .33], ["sawtooth", 1, 7, .33]], lp: [1.4, 3500, .2, 1.5, .4], amp: [.09, .5, .8, .3], lvl: .3 },
  ensemble: { name: "Ensemble cordes",  cat: "Cordes", osc: [["sawtooth", 1, -12, .25], ["sawtooth", 1, -4, .25], ["sawtooth", 1, 5, .25], ["sawtooth", 2, 9, .12]], lp: [2.2, 5000, .3, 1.4, .5], amp: [.25, .6, .85, .5], vib: [4.8, 8, .5], lvl: .27 },
  pizz:     { name: "Pizzicato",        cat: "Cordes", osc: [["sawtooth", 1, 0, .6], ["triangle", 1, 3, .4]], lp: [4, 6000, .5, 3, .12], amp: [.003, .25, 0, .12], lvl: .5 },
  nappe:    { name: "Nappe brillante",  cat: "Nappes", osc: [["sawtooth", 1, -7, .33], ["sawtooth", 1, 0, .33], ["sawtooth", 1, 7, .33]], lp: [2.6, 5000, .3, 1.2, .4], amp: [.05, .5, .8, .3], lvl: .3 },
  chaude:   { name: "Nappe chaude",     cat: "Nappes", osc: [["triangle", 1, -9, .4], ["triangle", 1, 9, .4], ["sine", .5, 0, .35]], lp: [3, 3000, .2], amp: [.35, .8, .9, .7], lvl: .45 },
  souffle:  { name: "Nappe soufflée",   cat: "Nappes", osc: [["sawtooth", 1, -10, .3], ["sawtooth", 1, 10, .3], ["square", .5, 0, .2]], lp: [1.1, 2400, 2.5, 2.5, 1.8], amp: [.6, 1, .9, 1.1], trem: [.3, .15], lvl: .3 },
  choeur:   { name: "Chœur « Aah »",    cat: "Nappes", osc: [["sawtooth", 1, -6, .35], ["sawtooth", 1, 6, .35]], bp: [[700, 6, 1], [1150, 7, .7], [2600, 9, .25]], amp: [.18, .6, .85, .45], vib: [5, 14, .3], lvl: .9 },
  ep:       { name: "Piano électrique", cat: "Claviers", osc: [["sine", 1, 0, 1]], fm: [1, 1.8, .6], amp: [.004, 1.4, .25, .3], lvl: .55 },
  epdoux:   { name: "Rhodes doux",      cat: "Claviers", osc: [["sine", 1, 0, 1], ["sine", 2, 2, .15]], fm: [1, .8, .9], amp: [.006, 2.2, .3, .4], trem: [4.5, .12], lvl: .55 },
  orgue:    { name: "Orgue",            cat: "Claviers", osc: [["sine", .5, 0, .5], ["sine", 1, 0, .7], ["sine", 1.5, 0, .35], ["sine", 2, 0, .4], ["sine", 4, 0, .15]], amp: [.01, .1, 1, .08], trem: [6.5, .08], lvl: .3 },
  clavecin: { name: "Clavecin",         cat: "Claviers", osc: [["sawtooth", 1, 0, .5], ["square", 2, 3, .2]], lp: [6, 8000, .6, 4, .25], amp: [.002, .9, 0, .25], lvl: .4 },
  vibra:    { name: "Vibraphone",       cat: "Percussions", osc: [["sine", 1, 0, 1], ["sine", 4, 0, .12]], amp: [.003, 2.5, 0, .6], trem: [5.5, .3], lvl: .55 },
  cloche:   { name: "Cloches",          cat: "Percussions", osc: [["sine", 1, 0, 1]], fm: [3.5, 2.5, 1.2], amp: [.003, 3, 0, 1], lvl: .45 },
  marimba:  { name: "Marimba",          cat: "Percussions", osc: [["sine", 1, 0, 1], ["sine", 4, 0, .3], ["sine", 10, 0, .06]], amp: [.002, .45, 0, .2], lvl: .65 },
  kalimba:  { name: "Kalimba",          cat: "Percussions", osc: [["sine", 1, 0, 1], ["triangle", 5.4, 0, .1]], amp: [.002, .8, 0, .3], lvl: .6 },
  flute:    { name: "Flûte",            cat: "Vents", osc: [["sine", 1, 0, 1], ["triangle", 2, 0, .12]], amp: [.05, .2, .85, .15], vib: [5, 16, .35], lvl: .5 },
  clarinette:{ name: "Clarinette",      cat: "Vents", osc: [["square", 1, 0, .6], ["sine", 1, 0, .4]], lp: [2.2, 2200, .8], amp: [.04, .2, .85, .12], vib: [5, 8, .5], lvl: .45 },
  cuivres:  { name: "Cuivres doux",     cat: "Vents", osc: [["sawtooth", 1, -5, .5], ["sawtooth", 1, 5, .5]], lp: [1.2, 3500, .5, 3.5, .3], amp: [.07, .4, .75, .2], vib: [5.5, 6, .4], lvl: .3 },
  guitare:  { name: "Guitare (corde pincée)", cat: "Cordes", osc: [["sawtooth", 1, 0, .6], ["triangle", 2, 0, .2]], lp: [3, 5000, .8, 4, .35], amp: [.002, 1.8, 0, .25], lvl: .45 },
  lead:     { name: "Lead synthé",      cat: "Synthé", osc: [["sawtooth", 1, -5, .4], ["square", 1, 5, .4]], lp: [3, 4500, 1, 2, .3], amp: [.005, .3, .75, .15], vib: [5.5, 15, .35], lvl: .3 },
  sinus:    { name: "Sinus pur",        cat: "Synthé", osc: [["sine", 1, 0, 1]], amp: [.01, .3, .9, .15], lvl: .6 },
  basse:    { name: "Basse synthé",     cat: "Synthé", osc: [["sawtooth", .5, 0, .5], ["square", .5, 7, .4], ["sine", .25, 0, .5]], lp: [2, 1600, .6, 2.5, .25], amp: [.004, .4, .7, .12], lvl: .4 },
};
const SOUND_IDS = Object.keys(SOUNDS);

function voice(n, vel, id, bus) {
  const P = SOUNDS[id] || SOUNDS.carre;
  const t0 = ac.currentTime, f = hz(n);
  const out = ac.createGain(); out.gain.value = 0;
  let head = out;                                   // là où arrivent les oscillateurs
  const nodes = [];
  if (P.bp) {                                       // formants (voix)
    const sum = ac.createGain(); sum.connect(out); head = ac.createGain();
    for (const [fr, q, g] of P.bp) { const b = ac.createBiquadFilter(); b.type = "bandpass"; b.frequency.value = fr; b.Q.value = q; const bg = ac.createGain(); bg.gain.value = g; head.connect(b); b.connect(bg); bg.connect(sum); }
  } else if (P.lp) {                                // passe-bas qui suit la note, avec son enveloppe
    const [mult, max, q, envMult, envDec] = P.lp;
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = q;
    // Jamais sous 900 Hz : le haut-parleur d'un téléphone ne rend presque rien en dessous de 200 Hz, et un filtre
    // trop bas sur une note grave ne laissait passer que ce qu'il ne joue pas (les accords semblaient très faibles).
    const base = Math.max(Math.min(900, max), Math.min(max, f * mult));
    if (envMult) { lp.frequency.setValueAtTime(Math.min(12000, base * envMult), t0); lp.frequency.setTargetAtTime(base, t0 + 0.005, envDec / 3); }
    else lp.frequency.value = base;
    lp.connect(out); head = lp;
  }
  out.connect(bus);
  let vibGain = null;
  if (P.vib) {
    const [rate, cents, delay] = P.vib;
    const lfo = ac.createOscillator(); lfo.frequency.value = rate; vibGain = ac.createGain();
    vibGain.gain.setValueAtTime(0, t0); vibGain.gain.linearRampToValueAtTime(cents, t0 + delay);
    lfo.connect(vibGain); nodes.push(lfo);
  }
  for (const [type, ratio, det, g] of P.osc) {
    const o = ac.createOscillator(); o.type = type; o.frequency.value = f * ratio; o.detune.value = det;
    const og = ac.createGain(); og.gain.value = g; o.connect(og); og.connect(head);
    if (vibGain) vibGain.connect(o.detune);
    if (P.fm) {                                     // modulation de fréquence : un sinus module la fréquence
      const [r, index, dec] = P.fm;
      const m = ac.createOscillator(); m.frequency.value = f * ratio * r;
      const mg = ac.createGain(); mg.gain.setValueAtTime(f * index * (0.5 + vel * 0.7), t0); mg.gain.setTargetAtTime(f * index * 0.08, t0, dec / 3);
      m.connect(mg); mg.connect(o.frequency); nodes.push(m);
    }
    nodes.push(o);
  }
  if (P.trem) {
    const [rate, depth] = P.trem;
    const lfo = ac.createOscillator(); lfo.frequency.value = rate; const lg = ac.createGain(); lg.gain.value = depth;
    const tg = ac.createGain(); tg.gain.value = 1 - depth / 2;
    lfo.connect(lg); lg.connect(tg.gain); out.disconnect(); out.connect(tg); tg.connect(bus); nodes.push(lfo);
  }
  const [a, d, sus, rel] = P.amp;
  const peak = vel * P.lvl;
  out.gain.setValueAtTime(0, t0);
  out.gain.linearRampToValueAtTime(peak, t0 + a);
  out.gain.setTargetAtTime(Math.max(peak * sus, 0.0001), t0 + a, d / 3);
  nodes.forEach(o => o.start(t0));
  return { stop() {
    const t = ac.currentTime;
    out.gain.cancelScheduledValues(t); out.gain.setValueAtTime(out.gain.value, t);
    out.gain.setTargetAtTime(0, t, rel / 4);
    nodes.forEach(o => o.stop(t + rel * 1.6 + 0.05));
    setTimeout(() => out.disconnect(), (rel * 1.6 + 0.2) * 1000);
  } };
}
let chordVoices = [];
function playChord(c) {
  audio();
  chordVoices.forEach(v => v.stop());
  // L'accord autour de Fa3–Fa♯4, la basse une octave dessous : assez haut pour le haut-parleur du téléphone.
  const base = 60 + c.pc - (c.pc >= 7 ? 12 : 0);
  const notes = [base - 12, ...D.types[c.t].tones.map(x => base + x[0])];
  chordVoices = notes.map((n, i) => voice(n, i === 0 ? 0.7 : 0.85, S.tPad, busPad));
}
function stopChord() { chordVoices.forEach(v => v.stop()); chordVoices = []; }

// ------------------------------------------------------------------ dessin
const $ = id => document.getElementById(id);
const TNAME = Object.fromEntries(SOUND_IDS.map(k => [k, SOUNDS[k].name]));
let padNotes = [];   // notes affichées, pour le doigt
function render() {
  const m = mode();
  $("keyBtn").textContent = `${nameOf(S.root)} ${m.short.toLowerCase()} ▾`;
  $("stacks").innerHTML = D.stackKinds.map(([k, l]) => `<button class="pill ${S.stack === k ? "on" : ""}" data-stack="${k}">${l}</button>`).join("");
  $("tSolo").textContent = TNAME[S.tSolo]; $("tPad").textContent = TNAME[S.tPad];
  $("hold").textContent = S.hold ? "Tenu" : "Au doigt"; $("hold").classList.toggle("on", S.hold);
  $("octLbl").textContent = `oct. ${S.oct > 0 ? "+" : ""}${S.oct}`;
  $("vPad").value = S.vPad; $("vSolo").value = S.vSolo;
  // gamme
  const cands = scaleCands();
  const sel = selS || (cands[0] ? { s: cands[0].g.i, t: cands[0].t } : null);
  const g = sel ? D.gscales.find(x => x.i === sel.s) : null;
  const tonic = g ? sel.t : S.root;
  const pcs = g ? [...Array(12).keys()].filter(i => g.mask[(i - tonic + 12) % 12] === 1) : keyScale().map(n => n.pc);
  $("scaleTitle").textContent = g ? `${nameOf(tonic)} ${g.name.toLowerCase()}` : `${nameOf(S.root)} ${m.short.toLowerCase()}`;
  const sug = cur ? D.types[cur.t].sug : -1;
  $("scales").innerHTML = cands.length > 1 ? cands.map(c => `<button class="pill ${sel && sel.s === c.g.i && sel.t === c.t ? "on" : ""}" data-s="${c.g.i}" data-t="${c.t}">${nameOf(c.t)} ${c.g.name.toLowerCase()}${c.g.i === sug && c.sh === 0 ? " ★" : ""}</button>`).join("") : "";
  // pads : toujours les mêmes places (les notes de la tonalité, sur deux octaves), comme un clavier ;
  // chacune joue la note la plus proche dans la gamme de l'accord (comme le scriptlet quantifie la main droite).
  const cp = cur ? chordPcs(cur) : [];
  const avoid = pcs.filter(p => !cp.includes(p) && cp.some(c => (p - c + 12) % 12 === 1));
  const kiv = mode().iv;
  const low = 60 + S.root - (S.root >= 6 ? 12 : 0) + 12 * S.oct;
  const snap = n => { for (const d of [0, 1, -1, 2, -2]) if (pcs.includes(((n + d) % 12 + 12) % 12)) return n + d; return n; };
  const rows = [[...kiv.map(x => low + 12 + x), low + 24].map(snap), kiv.map(x => low + x).map(snap)];
  padNotes = rows;
  const role = pc => { if (!cur) return ""; const x = D.types[cur.t].tones.find(t => t[0] % 12 === (pc - cur.pc + 12) % 12); return x ? x[2] : TENS[(pc - cur.pc + 12) % 12]; };
  $("pads").innerHTML = rows.map((r, ri) => `<div class="prow">${r.map(n => `<div class="p ${cp.includes(n % 12) ? "ch" : avoid.includes(n % 12) ? "av" : ""}" data-n="${n}"><b>${nameOf(n % 12)}</b><i>${role(n % 12)}</i></div>`).join("")}</div>`).join("");
  // accords
  const cs = chords();
  const suite = S.tab === "suite" && SUITE.length > 0;
  const nxt = cur && !suite ? (m.minor ? NEXT_MIN : NEXT_MAJ)[(cur.pc - S.root + 12) % 12] : [];
  // Rangées de 4 ; la dernière se partage la largeur.
  const span = k => { const last = Math.floor((cs.length - 1) / 4) * 4; return k >= last ? 12 / (cs.length - last) : 3; };
  $("tabs").innerHTML = SUITE.length ? [["deg", "Degrés"], ["suite", "Ma suite"]].map(([k, l]) => `<button class="pill ${S.tab === k ? "on" : ""}" data-tab="${k}">${l}</button>`).join("") : "";
  $("chordTitle").textContent = cur ? `${sp[cur.l][cur.pc]}${D.types[cur.t].sym}` : "main gauche";
  $("chords").innerHTML = cs.map(c => {
    const on = cur && cur.i === c.i;
    const nx = !on && (suite ? cur && (cur.i + 1) % cs.length === c.i : nxt.includes((c.pc - S.root + 12) % 12));
    return `<div class="c i${suite ? "s" : c.i} ${on ? "on" : ""} ${nx ? "nx" : ""}" style="grid-column:span ${span(c.i)}" data-c="${c.i}"><small>${c.lab}${nx ? " →" : ""}</small><b class="${(D.types[c.t].sym || "").length > 7 ? "long" : ""}">${sp[c.l][c.pc]}${D.types[c.t].sym}</b></div>`;
  }).join("");
  // Les couleurs de l'accord touché : toutes les variantes de sa qualité, sur sa fondamentale.
  if (cur) {
    const c = cs[cur.i];
    const vs = [...new Set([c.t, ...D.qvars[c.q]])].filter(t => D.types[t]);
    $("vars").innerHTML = vs.map(t => `<button class="pill ${cur.t === t ? "on" : ""}" data-v="${t}">${sp[c.l][c.pc]}${D.types[t].sym || ""}</button>`).join("");
  } else $("vars").innerHTML = `<span class="lbl">Touche un accord : ses couleurs (6, add9, 7♭9, 13…) s'afficheront ici.</span>`;
  $("keys").innerHTML = [...Array(12).keys()].map(pc => `<button class="pill ${S.root === pc ? "on" : ""}" data-k="${pc}">${sp[keyL[pc]][pc]}</button>`).join("");
  $("modes").innerHTML = D.modes.filter((x, k) => k < 9 || x.id === S.mode).map(x => `<button class="pill ${S.mode === x.id ? "on" : ""}" data-m="${x.id}">${x.short}</button>`).join("");
  lightPads();
}

// ------------------------------------------------------------------ jeu : un doigt = une note, glisser change de note
const fingers = new Map();   // pointerId -> {n, v}
function lightPads() {
  const held = new Set([...fingers.values()].map(f => f.n));
  document.querySelectorAll(".p").forEach(el => el.classList.toggle("down", held.has(+el.dataset.n)));
}
function padAt(x, y) { const el = document.elementFromPoint(x, y); return el && el.closest(".p"); }
function fingerTo(id, el, y) {
  const f = fingers.get(id);
  const n = el ? +el.dataset.n : null;
  if (f && f.n === n) return;
  if (f) { f.v.stop(); fingers.delete(id); }
  if (n !== null) {
    audio();
    const r = el.getBoundingClientRect();
    const vel = 0.55 + 0.45 * Math.min(1, Math.max(0, (y - r.top) / r.height));
    fingers.set(id, { n, v: voice(n, vel, S.tSolo, busSolo) });
  }
  lightPads();
}
const padsEl = $("pads");
padsEl.addEventListener("pointerdown", e => { e.preventDefault(); padsEl.releasePointerCapture?.(e.pointerId); fingerTo(e.pointerId, padAt(e.clientX, e.clientY), e.clientY); });
document.addEventListener("pointermove", e => { if (fingers.has(e.pointerId)) fingerTo(e.pointerId, padAt(e.clientX, e.clientY), e.clientY); });
const lift = e => { if (fingers.has(e.pointerId)) fingerTo(e.pointerId, null, 0); };
document.addEventListener("pointerup", lift);
document.addEventListener("pointercancel", lift);
document.addEventListener("contextmenu", e => e.preventDefault());

// accords : sonnent tant que le doigt est posé (ou jusqu'au suivant avec « Tenu »)
let chordPointer = null;
const chordUp = e => { if (e.pointerId === chordPointer) { chordPointer = null; if (!S.hold) stopChord(); } };
document.addEventListener("pointerup", chordUp);
document.addEventListener("pointercancel", chordUp);
$("hold").onclick = () => { S.hold = !S.hold; save(); if (!S.hold && chordPointer === null) stopChord(); render(); };
$("chords").addEventListener("pointerdown", e => {
  const el = e.target.closest(".c"); if (!el) return;
  chordPointer = e.pointerId;
  const c = chords()[+el.dataset.c];
  cur = { pc: c.pc, l: c.l, t: c.t, i: c.i }; selS = null;
  playChord(c); render();
});
// une couleur : même mécanique (au doigt ou tenue)
$("vars").addEventListener("pointerdown", e => {
  const b = e.target.closest("[data-v]"); if (!b || !cur) return;
  chordPointer = e.pointerId;
  cur = Object.assign({}, cur, { t: b.dataset.v }); selS = null;
  playChord(cur); render();
});
$("tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (!b) return; S.tab = b.dataset.tab; stopChord(); cur = null; selS = null; render(); });
$("stop").onclick = () => { stopChord(); cur = null; selS = null; render(); };
$("scales").addEventListener("click", e => { const b = e.target.closest("[data-s]"); if (!b) return; selS = { s: +b.dataset.s, t: +b.dataset.t }; render(); });
$("stacks").addEventListener("click", e => { const b = e.target.closest("[data-stack]"); if (!b) return; S.stack = b.dataset.stack; save(); if (cur && S.tab !== "suite") { const c = chords()[cur.i]; cur = { pc: c.pc, l: c.l, t: c.t, i: c.i }; if (S.hold || chordPointer !== null) playChord(c); } render(); });
// Choisir un son : la liste par familles ; un toucher l'essaie (une note ou l'accord) et le garde.
let soundFor = null;
function openSounds(which) {
  soundFor = which;
  const cats = [...new Set(SOUND_IDS.map(k => SOUNDS[k].cat))];
  $("soundTitle").textContent = which === "solo" ? "Son du solo" : "Son des accords";
  $("soundList").innerHTML = cats.map(c => `<div class="lbl">${c}</div><div class="chips">${SOUND_IDS.filter(k => SOUNDS[k].cat === c).map(k => `<button class="pill ${(which === "solo" ? S.tSolo : S.tPad) === k ? "on" : ""}" data-snd="${k}">${SOUNDS[k].name}</button>`).join("")}</div>`).join("");
  $("sounds").style.display = "flex";
}
$("tSolo").onclick = () => openSounds("solo");
$("tPad").onclick = () => openSounds("pad");
$("sounds").addEventListener("click", e => {
  const b = e.target.closest("[data-snd]");
  if (b) {
    audio();
    if (soundFor === "solo") { S.tSolo = b.dataset.snd; const v = voice(60 + S.root + 12 * S.oct, 0.8, S.tSolo, busSolo); setTimeout(() => v.stop(), 450); }
    else { S.tPad = b.dataset.snd; if (cur) { if (S.hold) playChord(cur); else { playChord(cur); setTimeout(() => { if (chordPointer === null && !S.hold) stopChord(); }, 900); } } }
    save(); openSounds(soundFor); render(); return;
  }
  if (e.target === $("sounds") || e.target.id === "soundOk") $("sounds").style.display = "none";
});
$("octDn").onclick = () => { S.oct = Math.max(-2, S.oct - 1); save(); render(); };
$("octUp").onclick = () => { S.oct = Math.min(1, S.oct + 1); save(); render(); };
$("vPad").oninput = e => { S.vPad = +e.target.value; mix(); save(); };
$("vSolo").oninput = e => { S.vSolo = +e.target.value; mix(); save(); };
$("keyBtn").onclick = () => { $("over").style.display = "flex"; };
$("over").addEventListener("click", e => {
  const k = e.target.closest("[data-k]"), m = e.target.closest("[data-m]");
  if (k) { S.root = +k.dataset.k; S.rootL = keyL[S.root]; }
  if (m) S.mode = m.dataset.m;
  if (k || m) { save(); stopChord(); cur = null; selS = null; render(); return; }
  if (e.target === $("over")) $("over").style.display = "none";
});
$("start").addEventListener("pointerdown", () => { audio(); ac.resume(); $("start").remove(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) { stopChord(); fingers.forEach(f => f.v.stop()); fingers.clear(); } });
render();
</script>
</body>
</html>
