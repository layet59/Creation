<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Création</title>
<style>
  :root { --bg:#0d1420; --card:#151e2c; --fg:#e8edf5; --muted:#8b97a8; --accent:#4a90d9; --gold:#f5b342; --red:#e5534b; --pad:#ecedf0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:none; overscroll-behavior:none; }
  /* Le bandeau « verrouillé · [ unlock ] » du launcher se pose sur l'en-tête de la face (au-dessus de la page) :
     la page commence tout en haut, avec les touches du solo. */
  #app { display:flex; flex-direction:column; gap:8px; height:100%; padding:6px 8px 10px; }
  .row { display:flex; gap:6px; align-items:center; }
  .pill { border:0; border-radius:13px; padding:7px 11px; font:600 13px system-ui; color:var(--fg); background:rgba(255,255,255,.09); white-space:nowrap; }
  .pill.on { background:rgba(74,144,217,.45); }
  .grow { flex:1; min-width:0; }
  .scroller { display:flex; gap:5px; overflow-x:auto; touch-action:pan-x; scrollbar-width:none; min-width:0; }
  .scroller::-webkit-scrollbar { display:none; }
  #scales .pill, #keysMode .pill { font-size:12px; padding:6px 10px; flex-shrink:0; }
  .vars .pill { font-size:13px; padding:7px 10px; } .vars .pill.on { background:rgba(245,179,66,.45); }
  .card { border-radius:16px; padding:9px 10px; display:flex; flex-direction:column; gap:7px; }
  .solo { background:rgba(74,144,217,.10); border:1px solid rgba(74,144,217,.55); flex:1; min-height:0; }
  .acc { background:rgba(245,179,66,.08); border:1px solid rgba(245,179,66,.55); }
  .tag { font:800 12px system-ui; letter-spacing:1.2px; }
  .title { font:600 13px system-ui; color:var(--fg); opacity:.9; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chips { display:flex; gap:5px; flex-wrap:wrap; }
  .chips .pill { font-size:12px; padding:6px 10px; }
  /* Le solo : une rangée de touches hautes et étroites tout en haut, la plus grave à gauche. Téléphone tourné d'un quart
     de tour (sens des aiguilles d'une montre, main gauche sur les accords), elles deviennent des barres couchées, la plus
     grave en haut et la plus aiguë en bas : un clavier d'accordéon. Les noms s'écrivent de côté pour se lire ainsi. */
  /* Deux rangées de 15 touches (4 octaves) : en haut les 2 octaves aiguës, en bas les 2 graves ; dans chaque rangée
     la note grave à droite (près de toi, téléphone tourné : la rangée du bas devient la colonne de gauche). */
  #pads { flex:1; display:flex; flex-direction:column; gap:6px; min-height:0; }
  .prow { flex:1; display:flex; flex-direction:row-reverse; gap:3px; min-height:0; }
  .p { flex:1; min-width:0; min-height:0; border-radius:7px; background:var(--pad); color:#1c1c1e; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:6px; gap:2px; transition:filter .05s; }
  .p b, .p i { writing-mode:vertical-rl; transform:rotate(180deg); white-space:nowrap; }
  .p b { font-size:13px !important; } .p i { font-size:10px !important; }
  .p b { font-size:14px; } .p i { font-style:normal; font-size:11px; opacity:.65; font-weight:600; }
  .p.ch { background:var(--gold); } .p.av { background:#a94a4d; color:#fff; } .p.down { background:var(--accent); color:#fff; }
  .chords { display:grid; grid-template-columns:repeat(12,1fr); gap:6px; }
  .c { grid-column:span 3; height:66px; border-radius:14px; background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.08); display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .c.r2 { grid-column:span 4; }
  .c small { font:700 11px system-ui; color:var(--accent); } .c.i0 small { color:var(--gold); }
  .c b { font:700 16px system-ui; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:96%; }
  .c b.long { font-size:12px; }
  .c.on { background:rgba(74,144,217,.55); } .c.on small { color:#fff; }
  .c.nx { border:2px solid rgba(245,179,66,.9); }
  input[type=range] { flex:1; min-width:0; accent-color:var(--accent); }
  .lbl { font-size:11px; color:var(--muted); }
  .over, #over { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-start; justify-content:center; padding-top:24px; z-index:5; }
  .over .box, #over .box { background:var(--card); border-radius:16px; padding:14px; width:calc(100% - 40px); display:flex; flex-direction:column; gap:8px; }
  #start { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(13,20,32,.85); z-index:9; font:700 18px system-ui; }
  /* Les noms de son longs se raccourcissent (…) au lieu de pousser ⏹ hors du cadre. */
  /* Écran plus large que haut (le téléphone s'est réorienté) : la page se met en position de jeu.
     À gauche les accords et les réglages (main gauche), à droite le solo sur toute la hauteur, en barres couchées,
     les aigus en haut et les graves en bas, les noms à l'endroit. */
  @media (orientation: landscape) {
    #app { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-auto-rows:min-content; column-gap:10px; row-gap:8px; align-content:start; }
    #app > .solo { grid-column:2; grid-row:1 / span 20; height:calc(100vh - 16px); }
    #app > :not(.solo) { grid-column:1; }
    #pads { flex-direction:row-reverse; }          /* colonne grave à gauche, aiguë à droite */
    .prow { flex-direction:column-reverse; }       /* graves en bas */
    #pads .p { flex-direction:row; justify-content:flex-start; padding:0 0 0 12px; gap:8px; background-image:linear-gradient(to right, rgba(255,255,255,.22), rgba(0,0,0,.22)); }
    .p b, .p i { writing-mode:horizontal-tb; transform:none; }
    .p b { font-size:15px !important; } .p i { font-size:11px !important; }
    .c { height:84px; }
    .c b { font-size:19px; }
  }
  #tSolo, #tPad { min-width:0; flex-shrink:1; overflow:hidden; text-overflow:ellipsis; }
  #pads .p { background-image:linear-gradient(to bottom, rgba(255,255,255,.22), rgba(0,0,0,.22)); }
  .chords .c { background-image:linear-gradient(to bottom, rgba(255,255,255,.06), rgba(0,0,0,.25)); }
</style>
</head>
<body>
<div id="app">
  <!-- Le solo en haut : une rangée de touches hautes, du grave (à gauche) à l'aigu (à droite), puis ses réglages. -->
  <div class="card solo">
    <div id="pads"></div>
    <div class="row">
      <span class="tag" style="color:var(--accent)">SOLO</span>
      <span class="title grow" id="scaleTitle"></span>
      <button class="pill" id="tSolo"></button>
      <button class="pill" id="octDn">−</button>
      <span class="lbl" id="octLbl"></span>
      <button class="pill" id="octUp">+</button>
    </div>
    <div class="scroller" id="scales"></div>
    <div class="scroller" id="keysMode"></div>
  </div>
  <div class="row">
    <button class="pill on" id="keyBtn"></button>
    <span id="stacks" class="scroller grow"></span>
  </div>
  <div class="card acc">
    <div class="row">
      <span class="tag" style="color:var(--gold)">ACCORDS</span>
      <span class="title grow" id="chordTitle"></span>
      <button class="pill" id="hold"></button>
      <button class="pill" id="tPad"></button>
      <button class="pill" id="stop">⏹</button>
    </div>
    <div class="row"><span class="row grow" id="tabs"></span>
      <button class="pill" id="octPadDn">−</button>
      <span class="lbl" id="octPadLbl"></span>
      <button class="pill" id="octPadUp">+</button></div>
    <div class="scroller vars" id="vars"></div>
    <div class="chords" id="chords"></div>
  </div>
  <div class="row"><span class="lbl">Toucher</span><button class="pill" id="touch"></button><span class="lbl grow" id="velInfo" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></span><button class="pill" id="aftBtn"></button><button class="pill" id="calBtn">Étalonner</button></div>
  <div class="row">
    <span class="lbl">Accords</span><input type="range" id="vPad" min="0" max="100">
    <span class="lbl">Solo</span><input type="range" id="vSolo" min="0" max="100">
    <span class="lbl">Réverb</span><input type="range" id="vRev" min="0" max="100">
  </div>
  <div class="row"><span class="lbl">Volume général</span><input type="range" id="vMax" min="0" max="100"></div>
</div>
<div id="over"><div class="box">
  <div class="lbl">Tonalité</div><div class="chips" id="keys"></div>
  <div class="lbl">Mode</div><div class="chips" id="modes"></div>
</div></div>
<div id="sounds" class="over" style="padding-top:24px"><div class="box" style="max-height:calc(100vh - 44px);overflow-y:auto;touch-action:pan-y;padding-top:0">
  <!-- Le titre et OK restent visibles en haut quand on fait défiler la liste ; un second bouton ferme en bas. -->
  <div class="row" style="position:sticky;top:0;background:var(--card);padding:12px 0 8px;z-index:1"><b id="soundTitle" class="grow"></b><button class="pill on" id="soundOk" style="padding:9px 18px">OK</button></div>
  <div class="chips" id="soundJump" style="position:sticky;top:52px;background:var(--card);padding-bottom:6px;z-index:1"></div>
  <div id="soundList" style="display:flex;flex-direction:column;gap:6px"></div>
  <button class="pill on" id="soundOk2" style="position:sticky;bottom:0;margin-top:8px;padding:12px;font-size:15px">Fermer</button>
</div></div>
<div id="calBox" class="over" style="flex-direction:column;align-items:stretch;padding:24px 20px 20px;gap:14px">
  <div class="row"><div id="calMsg" class="grow" style="font:600 16px system-ui;line-height:1.4"></div><button class="pill" id="calClose">✕</button></div>
  <div id="calPad" style="flex:1;border-radius:18px;background:rgba(255,255,255,.08);touch-action:none"></div>
</div>
<div id="start">Touche pour commencer</div>

const NUM = ["I", "II", "III", "IV", "V", "VI", "VII"];
const MAJ = [0, 2, 4, 5, 7, 9, 11];
const TENS = ["1", "♭9", "9", "♯9", "3", "11", "♯11", "5", "♭13", "13", "♭7", "7"];
const NEXT_MAJ = [[5, 7, 9, 2], [], [7, 5, 11], [], [9, 5], [7, 0, 2], [], [0, 9, 5], [], [2, 5, 7, 4], [], [0, 4]];
const NEXT_MIN = [[5, 8, 10, 7], [], [7], [8, 5], [], [7, 0, 10], [], [0, 8], [10, 5, 7], [], [3, 0], []];
const sp = D.spell;
const mode = () => D.modes.find(m => m.id === S.mode) || D.modes[0];
function keyScale() { const iv = mode().iv; return iv.map((x, i) => ({ pc: (S.root + x) % 12, l: (S.rootL + i) % 7 })); }
function nameOf(pc) { const ks = keyScale(); const k = ks.find(n => n.pc === pc); return k ? sp[k.l][pc] : sp[keyL[pc]][pc]; }
// La qualité d'un type d'accord, d'après ses notes, pour proposer ses couleurs.
function qualOf(t) {
  const st = new Set(D.types[t].tones.map(x => x[0] % 12)), h = k => st.has(k);
  return h(4) && h(10) ? "dom" : h(4) && h(8) && !h(7) ? "aug" : h(4) ? "maj" : h(3) && h(6) && h(10) ? "hdim" : h(3) && h(6) ? "dim" : h(3) ? "min" : h(10) ? "dom" : "maj";
}
function chords() {
  if (S.tab === "suite" && SUITE.length) return SUITE.map((c, k) => ({ i: k, pc: c.pc, l: c.l, t: c.t, acc: 0, q: qualOf(c.t), lab: `${k + 1}` }));
  const m = mode(), iv = m.iv;
  return iv.map((x, i) => {
    const t = m.stacks[S.stack][i];
    const acc = x - MAJ[i];
    const t3 = (iv[(i + 2) % 7] - x + 12) % 12, t5 = (iv[(i + 4) % 7] - x + 12) % 12, t7 = (iv[(i + 6) % 7] - x + 12) % 12;
    // La qualité du degré (pour ses couleurs) : majeur, mineur, dominante, demi-diminué, diminué, augmenté.
    const q = t3 === 4 && t5 === 7 ? (t7 === 10 ? "dom" : "maj") : t3 === 3 && t5 === 7 ? "min" : t3 === 3 && t5 === 6 ? (t7 === 10 ? "hdim" : "dim") : t3 === 4 && t5 === 8 ? "aug" : "maj";
    return { i, pc: (S.root + x) % 12, l: (S.rootL + i) % 7, t, acc, minor: t3 === 3, q, lab: (acc === -1 ? "♭" : acc === 1 ? "♯" : "") + (t3 === 3 ? NUM[i].toLowerCase() : NUM[i]) };
  });
}
function chordPcs(c) { return [...new Set(D.types[c.t].tones.map(x => (c.pc + x[0]) % 12))]; }
// La gamme de l'accord précédent (pour la continuité, comme le scriptlet qui part de la gamme en cours).
const scaleMem = { id: null, pcs: null, prev: null };
function scaleCands() {
  if (!cur) return [];
  const pcs = chordPcs(cur), keyPcs = keyScale().map(n => n.pc), sug = D.types[cur.t].sug;
  const cid = cur.pc + "." + cur.t, prev = cid !== scaleMem.id ? scaleMem.pcs : scaleMem.prev;
  const out = [];
  for (let sh = 0; sh < 12; sh++) for (const g of D.gscales) {
    const t = (cur.pc + sh) % 12;
    if (!pcs.every(p => g.mask[(p - t + 12) % 12] === 1)) continue;
    let score = -g.n + (sh === 0 ? 4 + (g.i === sug ? 12 : 0) : 0);
    for (let i = 0; i < 12; i++) if (g.mask[(i - t + 12) % 12] === 1 && keyPcs.includes(i)) score += 3;
    if (prev) for (let i = 0; i < 12; i++) if (g.mask[(i - t + 12) % 12] === 1 && prev.includes(i)) score += 2;
    out.push({ g, t, sh, score });
  }
  return out.sort((a, b) => b.score - a.score).slice(0, 4);
}

// ------------------------------------------------------------------ synthé WebAudio
let ac = null, master, busPad, busSolo, revSend, boost, chPad, chSolo;
function audio() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: "interactive" });
  const comp = ac.createDynamicsCompressor();
  // Compresseur en douceur, puis un niveau général sous 0 dB : rien ne sature, même un accord de 13e à 8 notes.
  comp.threshold.value = -10; comp.knee.value = 6; comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.25;
  master = ac.createGain(); master.gain.value = 0.85;
  busPad = ac.createGain(); busSolo = ac.createGain();
  busPad.connect(master); busSolo.connect(master); master.connect(comp);
  // Volume général : un gain après le compresseur (jusqu'à ×4, +12 dB), puis un limiteur (seuil −6 dB ; avec le gain de
  // rattrapage automatique de Chrome, sa sortie plafonne vers −2 dB) et, tout au bout, un écrêtage doux qui ne touche
  // que ce qui dépasserait 0,95 (rien d'habitude). Avant, l'écrêtage commençait à 0,8, sous la sortie du limiteur :
  // tous les sons forts passaient dedans et saturaient.
  boost = ac.createGain();
  const lim = ac.createDynamicsCompressor();
  lim.threshold.value = -6; lim.knee.value = 2; lim.ratio.value = 20; lim.attack.value = 0.003; lim.release.value = 0.25;
  const clip = ac.createWaveShaper(), N = 2048, cv = new Float32Array(N);
  for (let i = 0; i < N; i++) { const x = i / (N - 1) * 2 - 1, a = Math.abs(x); cv[i] = Math.sign(x) * (a < 0.95 ? a : 0.95 + 0.05 * Math.tanh((a - 0.95) / 0.05)); }
  clip.curve = cv; clip.oversample = "2x";
  comp.connect(boost); boost.connect(lim); lim.connect(clip); clip.connect(ac.destination);
  // Réverbération de salle : une réponse impulsionnelle stéréo calculée (bruit qui décroît en 2,4 s, plus sombre à la fin),
  // envoyée depuis les deux parties ; le son direct reste entier.
  const sr = ac.sampleRate, len = Math.round(sr * 2.4), ir = ac.createBuffer(2, len, sr);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); let lp = 0;
    for (let i = 0; i < len; i++) { const t = i / len, k = 0.25 + 0.7 * t; lp = lp * k + (Math.random() * 2 - 1) * (1 - k); d[i] = lp * Math.pow(1 - t, 2.2) * (i < sr * 0.012 ? i / (sr * 0.012) : 1) * 2.2; } }
  const conv = ac.createConvolver(); conv.buffer = ir;
  // Chorus stéréo (comme celui d'un Juno) sur chaque partie : deux retards de 12 et 17 ms qui ondulent lentement,
  // l'un à gauche, l'autre à droite. Son dosage vient du son choisi (ch), 0 pour les instruments enregistrés.
  const chorus = bus => {
    const mg = ac.createChannelMerger(2), cg = ac.createGain(); cg.gain.value = 0;
    [[0.012, 0.33, 0], [0.017, 0.27, 1]].forEach(([dt, rate, side]) => {
      const dl = ac.createDelay(0.05); dl.delayTime.value = dt;
      const lfo = ac.createOscillator(); lfo.frequency.value = rate; const lg = ac.createGain(); lg.gain.value = 0.0025;
      lfo.connect(lg); lg.connect(dl.delayTime); lfo.start();
      bus.connect(dl); dl.connect(mg, 0, side);
    });
    mg.connect(cg); cg.connect(master); return cg;
  };
  chPad = chorus(busPad); chSolo = chorus(busSolo);
  revSend = ac.createGain(); busPad.connect(revSend); busSolo.connect(revSend); revSend.connect(conv); conv.connect(master);
  mix(); preload();
}
function mix() { if (!ac) return; busPad.gain.value = S.vPad / 100 * 1.2; busSolo.gain.value = S.vSolo / 100 * 0.6; revSend.gain.value = S.vRev / 100 * 0.9;
  const chOf = id => (SOUNDS[id] && SOUNDS[id].ch) || 0;
  chPad.gain.value = busPad.gain.value * chOf(S.tPad) * 0.8; chSolo.gain.value = busSolo.gain.value * chOf(S.tSolo) * 0.8;
  boost.gain.value = 1 + 3 * Math.pow(S.vMax / 100, 1.3); }
const hz = m => 440 * Math.pow(2, (m - 69) / 12);

// Formes d'onde en plus des quatre de base : impulsions étroites (son nasillard des Juno, Prophet, consoles 8 bits).
// warm : dent de scie adoucie (harmoniques en 1/n^1,6) ; soft : entre triangle et carré (impaires 1/n^1,7, paires
// légères) ; hollow : creuse (impaires seulement, 1/n^1,3), proche d'un cuivre bouché ou d'une clarinette.
const WAVES = { pulse25: 0.25, pulse12: 0.125, warm: "warm", soft: "soft", hollow: "hollow" };
const WCACHE = {};
function wave(type) {
  if (WCACHE[type]) return WCACHE[type];
  const d = WAVES[type], N = 64, re = new Float32Array(N), im = new Float32Array(N);
  for (let k = 1; k < N; k++) im[k] = d === "warm" ? 1 / Math.pow(k, 1.6)
    : d === "soft" ? (k % 2 ? 1 / Math.pow(k, 1.7) : 0.25 / Math.pow(k, 2))
    : d === "hollow" ? (k % 2 ? 1 / Math.pow(k, 1.3) : 0)
    : (2 / (k * Math.PI)) * Math.sin(k * Math.PI * d);
  return WCACHE[type] = ac.createPeriodicWave(re, im);
}
let NOISE = null;
function noiseBuf() { if (NOISE) return NOISE; NOISE = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const d = NOISE.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return NOISE; }
function voice(n, vel, id, bus) {
  const P = SOUNDS[id] || SOUNDS.carre;
  const t0 = ac.currentTime, f = hz(n);
  const out = ac.createGain(); out.gain.value = 0;
  let head = out;                                   // là où arrivent les oscillateurs
  const nodes = [];
  if (P.bp) {                                       // formants (voix)
    const sum = ac.createGain(); sum.connect(out); head = ac.createGain();
    for (const [fr, q, g] of P.bp) { const b = ac.createBiquadFilter(); b.type = "bandpass"; b.frequency.value = fr; b.Q.value = q; const bg = ac.createGain(); bg.gain.value = g; head.connect(b); b.connect(bg); bg.connect(sum); }
  } else if (P.lp) {                                // passe-bas qui suit la note, avec son enveloppe
    const [mult, max, q, envMult, envDec] = P.lp;
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = q;
    // Jamais sous 900 Hz : le haut-parleur d'un téléphone ne rend presque rien en dessous de 200 Hz, et un filtre
    // trop bas sur une note grave ne laissait passer que ce qu'il ne joue pas (les accords semblaient très faibles).
    let base = Math.max(Math.min(900, max), Math.min(max, f * mult));
    // lpVel : la force ouvre le filtre (cuivres : doux = sombre, fort = brillant).
    if (P.lpVel) base = Math.min(14000, base * (1 - P.lpVel + P.lpVel * 1.7 * vel));
    if (P.lpRise) {                                 // le filtre s'ouvre lentement (nappe qui s'éclaire)
      lp.frequency.setValueAtTime(base * P.lpRise[0], t0); lp.frequency.setTargetAtTime(base, t0, P.lpRise[1] / 3);
    } else if (envMult) { lp.frequency.setValueAtTime(Math.min(12000, base * envMult), t0); lp.frequency.setTargetAtTime(base, t0 + 0.005, envDec / 3); }
    else lp.frequency.value = base;
    if (P.flfo) {                                   // le filtre qui ondule lentement (nappes qui respirent)
      const fl = ac.createOscillator(); fl.frequency.value = P.flfo[0];
      const fg = ac.createGain(); fg.gain.value = P.flfo[1] * 1200; fl.connect(fg); fg.connect(lp.detune); nodes.push(fl);
    }
    lp.connect(out); head = lp;
  }
  if (P.pk) {                                       // un formant (le « corps » d'un cuivre)
    const pk = ac.createBiquadFilter(); pk.type = "peaking"; [pk.frequency.value, pk.Q.value, pk.gain.value] = P.pk;
    out.connect(pk); pk.connect(bus);
  } else out.connect(bus);
  let vibGain = null;
  if (P.vib) {
    const [rate, cents, delay] = P.vib;
    const lfo = ac.createOscillator(); lfo.frequency.value = rate; vibGain = ac.createGain();
    vibGain.gain.setValueAtTime(0, t0); vibGain.gain.linearRampToValueAtTime(cents, t0 + delay);
    lfo.connect(vibGain); nodes.push(lfo);
  }
  // uni : chaque oscillateur doublé en n copies désaccordées et réparties en stéréo (le gros son des synthés analogiques).
  const [un, ucents, uspread] = P.uni || [1, 0, 0];
  const oscs = [];
  for (const [type, ratio, det, g] of P.osc) for (let u = 0; u < un; u++) {
    const x = un > 1 ? u / (un - 1) * 2 - 1 : 0;
    oscs.push([type, ratio, det + x * ucents, g / Math.sqrt(un), x * uspread]);
  }
  if (P.noise) {                                    // souffle
    const ns = ac.createBufferSource(); ns.buffer = noiseBuf(); ns.loop = true;
    const ng = ac.createGain(); ng.gain.value = P.noise; ns.connect(ng); ng.connect(head); nodes.push(ns);
  }
  for (const [type, ratio, det, g, pn] of oscs) {
    const o = ac.createOscillator();
    if (WAVES[type]) o.setPeriodicWave(wave(type)); else o.type = type;
    o.frequency.value = f * ratio; o.detune.value = det;
    if (P.pe) { o.detune.setValueAtTime(det + P.pe[0] * 100, t0); o.detune.setTargetAtTime(det, t0, P.pe[1] / 3); }
    const og = ac.createGain(); og.gain.value = g; o.connect(og);
    if (pn && ac.createStereoPanner) { const pp = ac.createStereoPanner(); pp.pan.value = pn; og.connect(pp); pp.connect(head); } else og.connect(head);
    if (vibGain) vibGain.connect(o.detune);
    if (P.fm) {                                     // modulation de fréquence : un sinus module la fréquence
      const [r, index, dec] = P.fm;
      const m = ac.createOscillator(); m.frequency.value = f * ratio * r;
      const mg = ac.createGain(); mg.gain.setValueAtTime(f * index * (0.5 + vel * 0.7), t0); mg.gain.setTargetAtTime(f * index * 0.08, t0, dec / 3);
      m.connect(mg); mg.connect(o.frequency); nodes.push(m);
    }
    nodes.push(o);
  }
  if (P.trem) {
    const [rate, depth] = P.trem;
    const lfo = ac.createOscillator(); lfo.frequency.value = rate; const lg = ac.createGain(); lg.gain.value = depth;
    const tg = ac.createGain(); tg.gain.value = 1 - depth / 2;
    lfo.connect(lg); lg.connect(tg.gain); out.disconnect(); out.connect(tg); tg.connect(bus); nodes.push(lfo);
  }
  const [a, d, sus, rel] = P.amp;
  const peak = Math.pow(vel, 1.5) * P.lvl;
  out.gain.setValueAtTime(0, t0);
  out.gain.linearRampToValueAtTime(peak, t0 + a);
  out.gain.setTargetAtTime(Math.max(peak * sus, 0.0001), t0 + a, d / 3);
  nodes.forEach(o => o.start(t0));
  return { stop() {
    const t = ac.currentTime;
    out.gain.cancelScheduledValues(t); out.gain.setValueAtTime(out.gain.value, t);
    out.gain.setTargetAtTime(0, t, rel / 4);
    nodes.forEach(o => o.stop(t + rel * 1.6 + 0.05));
    setTimeout(() => out.disconnect(), (rel * 1.6 + 0.2) * 1000);
  } };
}

// L'étalonnage : un grand pavé, 5 nuances de pianissimo à fortissimo, 4 coups chacune.
// Chaque coup sonne à la force visée, pour qu'on entende la nuance demandée.
const NUANCES = [["pp", "pianissimo", "à peine effleurer", 0.14], ["p", "piano", "doucement", 0.35], ["mf", "mezzo-forte", "normalement", 0.58],
  ["f", "forte", "fort", 0.8], ["ff", "fortissimo", "le plus fort possible", 1]];
const PER = 4;
let calib = null;
function startCal() {
  audio(); calib = NUANCES.map(() => []);
  $("calBox").style.display = "flex"; calStep();
}
const calLevel = () => calib.findIndex(l => l.length < PER);
function calStep() {
  const k = calLevel(), [sym, name, how] = NUANCES[k];
  $("calMsg").innerHTML = `<b style="font-size:22px">${sym}</b> ${name} — tape <b>${how}</b><br><span class="lbl">nuance ${k + 1} / 5 · coup ${calib[k].length + 1} / ${PER}</span>`;
  $("calPad").style.background = `rgba(${Math.round(74 + 143 * k / 4)},${Math.round(144 - 70 * k / 4)},${Math.round(217 - 143 * k / 4)},${0.25 + 0.06 * k})`;

  const slot = calib[k].length - 1;

    if (!calib) return;

    calib[k][slot] = { s: sh.amp, at: sh.at, c: pk.c, p: pk.p };
    report({ cal: NUANCES[k][0], s: +sh.amp.toFixed(3), at: Math.round(sh.at), c: f.c, p: +f.p.toFixed(3), mo: hasMotion() });

const median = xs => { const a = [...xs].sort((x, y) => x - y), m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; };

  const all = lv.flatMap((l, k) => l.map(x => Object.assign({ k }, x)));
  // Le capteur qui suit le mieux les nuances : la plus forte corrélation (de rang) entre la nuance et la mesure.
  const rank = xs => { const o = xs.map((x, i) => [x, i]).sort((a, b) => a[0] - b[0]), r = []; o.forEach(([, i], j) => r[i] = j); return r; };
  const corr = (a, b) => { const n = a.length, ma = a.reduce((x, y) => x + y) / n, mb = b.reduce((x, y) => x + y) / n;
    let sab = 0, saa = 0, sbb = 0; for (let i = 0; i < n; i++) { sab += (a[i] - ma) * (b[i] - mb); saa += (a[i] - ma) ** 2; sbb += (b[i] - mb) ** 2; }
    return saa && sbb ? sab / Math.sqrt(saa * sbb) : 0; };

    const xs = all.map(x => x[f]); if (Math.max(...xs) - Math.min(...xs) < 1e-6) continue;

      delay: best.f === "s" ? Math.min(120, Math.max(30, Math.max(...lv[4].map(x => x.at)) + 12)) : 0 };
    S.velHist = [];
    const q = Math.abs(best.r) > 0.9 ? "très nette" : Math.abs(best.r) > 0.75 ? "nette" : "moyenne";
    $("calMsg").innerHTML = `C'est réglé : la force suit <b>${FEATNAME[best.f]}</b>${sg < 0 ? " (en sens inverse sur ton téléphone)" : ""}.<br><span class="lbl">Distinction des 5 nuances : ${q} (${Math.abs(best.r).toFixed(2)})</span>`;
    showInfo(`étalonné : ${FEATNAME[best.f]}`);
  } else {
    S.cal = null; S.touchMode = "pos";
    $("calMsg").innerHTML = `Ton téléphone ne fait pas la différence entre les nuances.<br>Je passe en « Position ↓ » : bas de la touche = fort.`;
  }
  report({ calDone: S.cal, levels: lv });
  $("calPad").style.background = "rgba(255,255,255,.08)";

  setTimeout(() => { $("calBox").style.display = "none"; }, 4000);

$("calBtn").onclick = startCal;
$("calBox").addEventListener("click", e => { if (e.target.id === "calClose") { calib = null; $("calBox").style.display = "none"; } });
function fingerTo(id, el, y, e) {

  if (n !== null) {
    audio();
    // En glissant d'une touche à l'autre, la note suivante garde la force de la première.
    const vel = f ? f.vel : touchVel(el, y, e);

const padsEl = $("pads");

function clearStale(e) {
  if (!e.isPrimary) return;

// pression seule ne suffit pas. Le geste principal est donc de glisser le doigt LE LONG de la touche (sans changer de
