<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Synthé</title>
<style>
:root { --bg:#0e1014; --card:#171a21; --card2:#1f232c; --fg:#eceef3; --mut:#8d94a3; --gold:#F5B342; --blue:#5aa9ff; --line:#2a2f3a; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; user-select:none; -webkit-user-select:none; }
#app { height:100%; display:flex; flex-direction:column; gap:6px; padding:6px 8px 8px; }
.top { display:flex; align-items:center; gap:6px; }
.pill { border:1px solid var(--line); background:var(--card2); color:var(--fg); border-radius:999px; padding:7px 12px; font:600 13px system-ui; white-space:nowrap; }
.pill.on { background:var(--gold); color:#111; border-color:var(--gold); }
.pill.sm { padding:5px 9px; font-size:12px; }
#pname { flex:1; min-width:0; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:6px 8px; }
#pname b { display:block; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#pname small { color:var(--mut); font-size:11px; }
#scope { width:100%; height:44px; background:var(--card); border-radius:10px; display:block; }
.tabs { display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; }
.tabs::-webkit-scrollbar { display:none; }
.tabs button { flex:1; min-width:62px; border:0; background:var(--card); color:var(--mut); border-radius:10px; padding:8px 4px; font:700 12px system-ui; letter-spacing:.5px; }
.tabs button.on { background:var(--card2); color:var(--gold); box-shadow:inset 0 -2px 0 var(--gold); }
#panel { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding-bottom:4px; }
.card { background:var(--card); border-radius:12px; padding:8px 10px; display:flex; flex-direction:column; gap:6px; }
.card h3 { margin:0; font-size:12px; letter-spacing:1px; color:var(--gold); display:flex; align-items:center; gap:8px; }
.card h3 .sw { margin-left:auto; }
.card.off > :not(h3) { opacity:.35; pointer-events:none; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:4px 12px; }
.ctl { display:flex; flex-direction:column; gap:0; }
.ctl label { display:flex; justify-content:space-between; font-size:11px; color:var(--mut); }
.ctl label span { color:var(--fg); font-variant-numeric:tabular-nums; }
input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:30px; background:transparent; margin:0; touch-action:none; }
input[type=range]::-webkit-slider-runnable-track { height:6px; border-radius:3px; background:linear-gradient(90deg,var(--gold) var(--p,50%),var(--line) var(--p,50%)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:#fff; margin-top:-8px; box-shadow:0 1px 4px #0008; }
.chips { display:flex; gap:4px; flex-wrap:wrap; }
.chips button { border:1px solid var(--line); background:var(--card2); color:var(--fg); border-radius:8px; padding:5px 8px; font:600 12px system-ui; }
.chips button.on { background:var(--blue); border-color:var(--blue); color:#06121f; }
canvas.env { width:100%; height:70px; background:var(--card2); border-radius:8px; }
/* clavier */
#kbWrap { display:flex; flex-direction:column; gap:4px; }
.kbBar { display:flex; gap:4px; align-items:center; overflow-x:auto; scrollbar-width:none; }
#kb { position:relative; height:118px; touch-action:none; }
#kb .k { position:absolute; top:0; border-radius:0 0 6px 6px; }
#kb .w { height:100%; background:linear-gradient(#FCFBF8,#E8E5DD); border:1px solid #A8A39A; z-index:1; }
#kb .b { height:62%; background:linear-gradient(#2D313A,#14171D); border:1px solid #090B0E; z-index:2; }
#kb .k.on.w { background:linear-gradient(#FDE69E,#F5B342); border-color:#C28312; }
#kb .k.on.b { background:linear-gradient(#E5A124,#A66B0A); border-color:#3B2202; }
#kb .k i { position:absolute; bottom:4px; left:0; right:0; text-align:center; font:700 10px system-ui; color:#5A6270; font-style:normal; }
#bendBox { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--mut); }
/* fenêtres */
.ov { position:fixed; inset:0; background:#000b; display:none; align-items:flex-end; justify-content:center; z-index:10; }
.ov .box { background:var(--card); width:100%; max-width:720px; max-height:88%; border-radius:16px 16px 0 0; display:flex; flex-direction:column; }
.ov .hd { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line); }
.ov .hd b { flex:1; font-size:15px; }
.ov .bd { overflow-y:auto; padding:8px 12px 16px; display:flex; flex-direction:column; gap:6px; }
.lbl { font-size:11px; color:var(--mut); letter-spacing:1px; margin-top:6px; }
.row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
input[type=text] { flex:1; min-width:0; background:var(--card2); border:1px solid var(--line); color:var(--fg); border-radius:10px; padding:9px 10px; font:15px system-ui; }
.mine { display:flex; gap:6px; align-items:center; }
.mine .pill:first-child { flex:1; text-align:left; overflow:hidden; text-overflow:ellipsis; }
#toast { position:fixed; left:50%; bottom:150px; transform:translateX(-50%); background:var(--gold); color:#111; padding:8px 14px; border-radius:999px; font:700 13px system-ui; display:none; z-index:20; }
@media (orientation:landscape) and (min-width:700px) {
  #kb { height:150px; }
  .grid { grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); }
}
</style></head>
<body>
<div id="app">
  <div class="top">
    <button class="pill" id="prev">◀</button>
    <div id="pname"><b id="pn">—</b><small id="pc">—</small></div>
    <button class="pill" id="next">▶</button>
  </div>
  <div class="top">
    <button class="pill" id="lib">🎛 Sons</button>
    <button class="pill" id="save">💾 Garder</button>
    <button class="pill" id="vary">🎲 Varier</button>
    <button class="pill" id="undo">↶</button>
    <button class="pill" id="panic">⏹</button>
  </div>
  <canvas id="scope"></canvas>
  <div class="tabs" id="tabs"></div>
  <div id="panel"></div>
  <div id="kbWrap">
    <div class="kbBar">
      <button class="pill sm" id="octD">Oct −</button><span id="octV" style="font:700 12px system-ui;min-width:28px;text-align:center">0</span><button class="pill sm" id="octU">Oct +</button>
      <button class="pill sm" id="hold">Hold</button>
      <button class="pill sm" id="chord">Accord</button>
      <div id="bendBox">Molette <input type="range" id="bend" min="-100" max="100" value="0" style="width:110px;height:26px"></div>
    </div>
    <div id="kb"></div>
  </div>
</div>
<div class="ov" id="libBox"><div class="box"><div class="hd"><b>Sons</b><button class="pill" data-close>Fermer</button></div><div class="bd" id="libList"></div></div></div>
<div class="ov" id="saveBox"><div class="box"><div class="hd"><b>Garder ce son</b><button class="pill" data-close>Fermer</button></div><div class="bd">
  <div class="lbl">NOM</div><div class="row"><input type="text" id="sName" maxlength="40"></div>
  <div class="lbl">FAMILLE (sert aussi de rangement dans Création)</div><div class="chips" id="sCat"></div>
  <div class="row" style="margin-top:10px"><button class="pill on" id="sNew">Enregistrer comme nouveau</button><button class="pill" id="sRep" style="display:none">Remplacer « <span id="sRepN"></span> »</button></div>
  <div class="lbl">Les sons gardés apparaissent dans Création, dans la liste des sons, partie « Mes synthés ».</div>
</div></div></div>
<div id="toast"></div>
<script>
// ================================================================== SY : le moteur de synthèse (page Synthé + Création)
// Un son (« préréglage ») est un objet JSON simple ; SY.part(ac, sortie) crée une partie qui le joue, avec ses effets.
// 3 oscillateurs (formes, octave, demi-tons, désaccord, unisson, largeur d'impulsion), sous-oscillateur, bruit, FM,
// filtre 12/24 dB (passe-bas, passe-haut, passe-bande, coupe-bande) avec enveloppe, suivi de clavier et vélocité,
// 2 LFO (hauteur, filtre, volume, panoramique, largeur d'impulsion), enveloppe de hauteur, poly / mono / legato + glide,
// effets : saturation, chorus, phaser, écho, réverbe.
const SY = (() => {
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const OSC0 = { on: 1, w: "saw", oct: 0, semi: 0, fine: 0, lvl: 0.7, pw: 0.5, uni: 1, det: 12, spr: 0.6 };
  const DEF = {
    name: "Nouveau son", cat: "Mes sons",
    o: [{ ...OSC0 }, { ...OSC0, on: 0, fine: 7 }, { ...OSC0, on: 0, w: "square", oct: -1 }],
    sub: 0, noise: 0, ncol: 0.5, fm: 0,
    f: { t: "lp24", cut: 3000, res: 0.1, key: 0.5, env: 0.3, vel: 0.3, drive: 0 },
    fe: [0.005, 0.5, 0.3, 0.4], ae: [0.005, 0.3, 0.8, 0.3], vel: 0.6,
    pe: { amt: 0, t: 0.1 },
    l1: { w: "sine", rate: 5, delay: 0.3, pitch: 0, cut: 0, amp: 0, pan: 0, pw: 0 },
    l2: { w: "triangle", rate: 0.3, delay: 0, pitch: 0, cut: 0, amp: 0, pan: 0, pw: 0 },
    mode: "poly", glide: 0, bend: 2,
    fx: { drive: 0, cho: 0, chr: 0.5, chd: 0.5, pha: 0, phr: 0.4, dly: 0, dlt: 0.35, dlf: 0.35, dpp: 1, rev: 0.2, rsz: 0.6 },
    lvl: 0.7,
  };
  // Complète un son incomplet (anciens réglages, sons d'usine écrits en abrégé) avec les valeurs par défaut.
  function norm(p) {
    const q = JSON.parse(JSON.stringify(DEF)), s = p || {};
    for (const k in s) if (!["o", "f", "pe", "l1", "l2", "fx"].includes(k)) q[k] = s[k];
    for (const k of ["f", "pe", "l1", "l2", "fx"]) Object.assign(q[k], s[k] || {});
    q.o = [0, 1, 2].map(i => Object.assign({ ...OSC0, on: i === 0 ? 1 : 0 }, (s.o || [])[i] || {}));
    return q;
  }
  // ---- formes d'onde (tables de Fourier : sans repliement, comme un vrai oscillateur analogique)
  const WNAMES = { sine: "Sinus", triangle: "Triangle", saw: "Scie", square: "Carré", pulse: "Impulsion", warm: "Scie douce", soft: "Ronde", hollow: "Creuse", organ: "Orgue", bell: "Cloche", vox: "Voix", digi: "Numérique" };
  const WC = new WeakMap();
  function wave(ac, w) {
    let m = WC.get(ac); if (!m) WC.set(ac, m = {});
    if (m[w]) return m[w];
    const N = 96, re = new Float32Array(N), im = new Float32Array(N);
    for (let k = 1; k < N; k++) {
      im[k] = w === "saw" ? 1 / k : w === "warm" ? 1 / Math.pow(k, 1.6)
        : w === "square" ? (k % 2 ? 1 / k : 0) : w === "soft" ? (k % 2 ? 1 / Math.pow(k, 1.7) : 0.25 / (k * k))
        : w === "hollow" ? (k % 2 ? 1 / Math.pow(k, 1.3) : 0)
        : w === "triangle" ? (k % 2 ? (((k - 1) / 2) % 2 ? -1 : 1) / (k * k) : 0)
        : w === "organ" ? ([0, 1, .8, .5, .6, 0, .3, 0, .4][k] || 0)
        : w === "bell" ? ([0, 1, 0, .5, 0, 0, .35, 0, 0, 0, .25, 0, 0, 0, 0, .15][k] || 0)
        : w === "vox" ? Math.exp(-Math.pow((k * 130 - 700) / 380, 2)) + 0.6 * Math.exp(-Math.pow((k * 130 - 1200) / 300, 2)) + 0.25 * Math.exp(-Math.pow((k * 130 - 2600) / 400, 2)) + (k === 1 ? .5 : 0)
        : w === "digi" ? (k < 40 ? Math.abs(Math.sin(k * 1.7)) / Math.sqrt(k) : 0)
        : k === 1 ? 1 : 0;
    }
    return m[w] = ac.createPeriodicWave(re, im);
  }
  const NB = new WeakMap();
  function noise(ac) {   // bruit blanc et bruit rose (2 s, en boucle)
    if (NB.has(ac)) return NB.get(ac);
    const L = ac.sampleRate * 2, b = ac.createBuffer(2, L, ac.sampleRate), w = b.getChannelData(0), p = b.getChannelData(1);
    let b0 = 0, b1 = 0, b2 = 0;
    for (let i = 0; i < L; i++) { const x = Math.random() * 2 - 1; w[i] = x;
      b0 = 0.99765 * b0 + x * 0.099046; b1 = 0.963 * b1 + x * 0.2965164; b2 = 0.57 * b2 + x * 1.0526913; p[i] = (b0 + b1 + b2 + x * 0.1848) * 0.2; }
    NB.set(ac, b); return b;
  }
  // Courbes de saturation, gardées par quantité.
  const SC = {};
  function curve(k) { k = Math.round(k * 20) / 20; if (SC[k]) return SC[k];
    const N = 1024, c = new Float32Array(N), d = 1 + k * 12;
    for (let i = 0; i < N; i++) { const x = i / (N - 1) * 2 - 1; c[i] = Math.tanh(d * x) / Math.tanh(d); } return SC[k] = c; }
  const lfoType = w => (w === "saw" ? "sawtooth" : w === "square" ? "square" : w === "triangle" ? "triangle" : "sine");
  // ---- une voix : sources → saturation → filtre(s) → volume (enveloppe) → panoramique → entrée de la partie
  function voice(ac, P, n, vel, t0, dest, from) {
    const nodes = [], f0 = hz(n), velA = 1 - P.vel + P.vel * Math.pow(vel, 1.5);
    const amp = ac.createGain(); amp.gain.value = 0;
    const atSw = ac.createGain(); atSw.gain.value = 1;
    const pan = ac.createStereoPanner ? ac.createStereoPanner() : ac.createGain();
    amp.connect(atSw); atSw.connect(pan); pan.connect(dest);
    const mix = ac.createGain(); mix.gain.value = 1;
    let head = mix;
    let shp = null;
    if (P.f.drive > 0) { shp = ac.createWaveShaper(); shp.curve = curve(P.f.drive); shp.oversample = "2x"; mix.connect(shp); head = shp; }
    // Filtre : 12 dB = un biquad, 24 dB = deux à la suite. Le suivi de clavier ouvre le filtre sur les notes aiguës,
    // la vélocité l'ouvre quand on joue fort ; son enveloppe et le LFO passent par le « detune » (en cents).
    const ft = P.f.t, bt = ft.startsWith("lp") ? "lowpass" : ft.startsWith("hp") ? "highpass" : ft === "bp" ? "bandpass" : ft === "notch" ? "notch" : "lowpass";
    const nb = ft.endsWith("24") ? 2 : 1, bq = [];
    const baseCut = () => Math.min(18000, Math.max(30, P.f.cut * Math.pow(2, P.f.key * (n - 60) / 12) * Math.pow(2, P.f.vel * (vel - 0.6) * 2.5)));
    for (let i = 0; i < nb; i++) { const b = ac.createBiquadFilter(); b.type = bt; b.frequency.value = baseCut();
      b.Q.value = bt === "lowpass" || bt === "highpass" ? 0.7 + P.f.res * (nb === 2 ? 11 : 18) * (i === nb - 1 ? 1 : 0.35) : 0.5 + P.f.res * 12;
      head.connect(b); head = b; bq.push(b); }
    head.connect(amp);
    const kc = Math.max(0.4, 1 - P.f.res * 0.45);  // la résonance gonfle le volume : on compense un peu
    // Une source de « cents » commune : enveloppe du filtre (± 6 octaves), LFO filtre.
    const fd = ac.createConstantSource ? ac.createConstantSource() : null;
    if (fd) { fd.offset.value = 0; bq.forEach(b => fd.connect(b.detune)); nodes.push(fd); }
    // Hauteur commune : enveloppe de hauteur, glide, LFO hauteur, molette (cents) → detune de chaque oscillateur.
    const pc = ac.createConstantSource ? ac.createConstantSource() : null; if (pc) nodes.push(pc);
    const oscs = [];   // { o, ratio, dl, pw } : pour réaccorder en mono / legato
    const pwBus = ac.createGain(); pwBus.gain.value = 1;   // LFO → largeur d'impulsion (secondes, mis à l'échelle par note)
    const addOsc = (w, ratio, det, g, pn, pw) => {
      const o = ac.createOscillator(), og = ac.createGain(); og.gain.value = g;
      if (w === "pulse" || w === "square" && pw !== 0.5 && pw != null) {
        // Impulsion à largeur variable = une scie moins la même scie retardée (pw / f) : la largeur se module.
        o.setPeriodicWave(wave(ac, "saw"));
        const dl = ac.createDelay(0.1), inv = ac.createGain(); inv.gain.value = -1;
        dl.delayTime.value = Math.min(0.95, Math.max(0.05, pw)) / (f0 * ratio);
        const pg = ac.createGain(); pg.gain.value = 1 / (f0 * ratio); pwBus.connect(pg); pg.connect(dl.delayTime);
        o.connect(og); o.connect(dl); dl.connect(inv); inv.connect(og); oscs.push({ o, ratio, dl, pw, pg });
      } else { o.setPeriodicWave(wave(ac, w)); o.connect(og); oscs.push({ o, ratio }); }
      o.frequency.value = f0 * ratio; o.detune.value = det; if (pc) pc.connect(o.detune);
      if (pn && ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = pn; og.connect(p); p.connect(mix); } else og.connect(mix);
      nodes.push(o); return o;
    };
    let o1 = [];
    P.o.forEach((O, idx) => { if (!O.on || O.lvl <= 0) return;
      const ratio = Math.pow(2, O.oct + O.semi / 12), u = Math.max(1, Math.min(7, O.uni | 0));
      for (let k = 0; k < u; k++) { const x = u > 1 ? k / (u - 1) * 2 - 1 : 0;
        const o = addOsc(O.w, ratio, O.fine + x * O.det, 0.45 * O.lvl / Math.sqrt(u), x * O.spr, O.w === "pulse" ? O.pw : O.w === "square" ? 0.5 : null);
        if (idx === 0) o1.push({ o, ratio }); } });
    if (P.sub > 0) addOsc("sine", Math.pow(2, (P.o[0].oct || 0) - 1), 0, 0.5 * P.sub, 0);
    if (P.noise > 0) { const ns = ac.createBufferSource(); ns.buffer = noise(ac); ns.loop = true;
      ns.loopStart = Math.random(); const sp = ac.createChannelSplitter(2), gw = ac.createGain(), gp = ac.createGain();
      gw.gain.value = P.noise * 0.35 * (1 - P.ncol); gp.gain.value = P.noise * 0.9 * P.ncol;
      ns.connect(sp); sp.connect(gw, 0); sp.connect(gp, 1); gw.connect(mix); gp.connect(mix); nodes.push(ns); }
    // FM : un sinus à la hauteur de l'oscillateur 2 module la fréquence de l'oscillateur 1 (cloches, pianos FM, basses).
    let fmG = null;
    if (P.fm > 0 && o1.length) { const O2 = P.o[1], r2 = Math.pow(2, O2.oct + O2.semi / 12);
      const m = ac.createOscillator(); m.frequency.value = f0 * r2; m.detune.value = O2.fine; if (pc) pc.connect(m.detune);
      fmG = ac.createGain(); const idx = f0 * P.fm * 6 * (0.5 + 0.7 * vel);
      // l'indice suit l'enveloppe du filtre : brillant à l'attaque, plus rond ensuite
      const [fa, fdc, fs] = P.fe; fmG.gain.setValueAtTime(0, t0); fmG.gain.linearRampToValueAtTime(idx, t0 + Math.max(0.002, fa));
      fmG.gain.setTargetAtTime(idx * (0.25 + 0.75 * fs), t0 + fa, Math.max(0.01, fdc) / 3);
      m.connect(fmG); o1.forEach(x => fmG.connect(x.o.frequency)); nodes.push(m); }
    // ---- LFO (chaque voix a les siens : leur retard part de la note)
    const lfo = L => { if (!(L.pitch || L.cut || L.amp || L.pan || L.pw)) return null;
      const o = ac.createOscillator(); o.type = lfoType(L.w); o.frequency.value = L.rate;
      const fade = ac.createGain(); fade.gain.setValueAtTime(L.delay > 0 ? 0 : 1, t0); if (L.delay > 0) fade.gain.linearRampToValueAtTime(1, t0 + L.delay);
      o.connect(fade); nodes.push(o);
      const to = (amt, param) => { const g = ac.createGain(); g.gain.value = amt; fade.connect(g); g.connect(param); return g; };
      const r = {};
      if (L.pitch && pc) r.pitch = to(L.pitch, pc.offset);
      if (L.cut && fd) r.cut = to(L.cut * 2400, fd.offset);
      if (L.amp) { const tg = ac.createGain(); tg.gain.value = 1 - L.amp / 2; amp.disconnect(); amp.connect(tg); tg.connect(atSw); r.amp = to(L.amp / 2, tg.gain); }
      if (L.pan && pan.pan) r.pan = to(L.pan, pan.pan);
      if (L.pw) r.pw = to(L.pw * 0.4, pwBus.gain.value !== undefined ? pwBus : pwBus);
      return r; };
    // le LFO → largeur d'impulsion passe par pwBus, une source à 0 sinon (pwBus sert d'entrée)
    const pwSrc = ac.createConstantSource ? ac.createConstantSource() : null;
    if (pwSrc) { pwSrc.offset.value = 0; pwSrc.connect(pwBus); nodes.push(pwSrc); }
    pwBus.disconnect(); oscs.filter(x => x.pg).forEach(x => pwBus.connect(x.pg));
    const lf1 = lfo(P.l1), lf2 = lfo(P.l2);
    // ---- aftertouch matériel natif (P.at) : vrai vibrato d'oscillateur (sans artefact de retard),
    // ouverture progressive du filtre analogique et gonflement expressif du volume.
    let atLfo = null, atVibG = null, atCut = null;
    if (P.at) {
      atLfo = ac.createOscillator(); atLfo.type = "sine"; atLfo.frequency.value = P.at.rate || 5.2;
      atVibG = ac.createGain(); atVibG.gain.value = 0;
      atLfo.connect(atVibG);
      if (pc) atVibG.connect(pc.offset);
      nodes.push(atLfo);
      if (P.at.cut && fd && ac.createConstantSource) {
        atCut = ac.createConstantSource(); atCut.offset.value = 0;
        atCut.connect(fd.offset);
        nodes.push(atCut);
      }
    }
    // ---- enveloppes

// ---- description des commandes : [chemin, libellé, min, max, échelle, format]

  C(b + ".pitch", "→ Hauteur (vibrato)", 0, 200, "sq", fI(" ct")), C(b + ".cut", "→ Filtre", -1, 1, "lin", fS), C(b + ".amp", "→ Volume (trémolo)", 0, 1, "lin", fP),

function toT(c, v) { if (c.sc === "log") return Math.log(v / c.min) / Math.log(c.max / c.min); if (c.sc === "sq") return Math.sqrt((v - c.min) / (c.max - c.min)); return (v - c.min) / (c.max - c.min); }

const sw = (key, on) => `<button class="pill sm sw ${on ? "on" : ""}" data-tog="${key}">${on ? "Marche" : "Arrêt"}</button>`;

function renderPanel() {
  for (const k in CTLS) delete CTLS[k];
  let h = "";
  if (ST.tab === "osc") {
    P.o.forEach((O, i) => {
      const cs = [C(`o.${i}.lvl`, "Niveau", 0, 1, "lin", fP), C(`o.${i}.oct`, "Octave", -3, 3, "lin", fI(""), 1), C(`o.${i}.semi`, "Demi-tons", -12, 12, "lin", fI(""), 1),
        C(`o.${i}.fine`, "Désaccord fin", -50, 50, "lin", fI(" ct"), 1), C(`o.${i}.uni`, "Unisson (voix)", 1, 7, "lin", v => Math.round(v) + "", 1)];
      if (O.uni > 1) cs.push(C(`o.${i}.det`, "Écart de l'unisson", 0, 60, "lin", fI(" ct"), 1), C(`o.${i}.spr`, "Largeur stéréo", 0, 1, "lin", fP));

      h += card(`OSCILLATEUR ${i + 1}`, cs, chips(`o.${i}.w`, WAVES.map(w => [w, SY.WNAMES[w]]), O.w), sw(`o.${i}.on`, O.on), !O.on);

  } else if (ST.tab === "filtre") {

      C("f.key", "Suivi du clavier", 0, 1, "lin", fP), C("f.vel", "Vélocité → filtre", 0, 1, "lin", fP), C("f.drive", "Saturation avant filtre", 0, 1, "lin", fP)],

    h += card("RÉVERBE", [C("fx.rev", "Dosage", 0, 1, "lin", fP), C("fx.rsz", "Taille de la salle", 0, 1, "lin", fP)]);

      chips("mode", [["poly", "Polyphonique"], ["mono", "Mono"], ["legato", "Legato"]], P.mode) +
      `<div class="lbl" style="margin:0">Mono : une note à la fois, chaque note relance l'enveloppe. Legato : les notes liées glissent sans relancer (solos, basses). Le glide marche aussi en polyphonique. Dans Création, les accords restent toujours polyphoniques.</div>`);
  }

}
function renderTabs() { $("tabs").innerHTML = TABS.map(([k, l]) => `<button data-tab="${k}" class="${ST.tab === k ? "on" : ""}">${l}</button>`).join(""); }
function renderHead() {

// Dessin des enveloppes (attaque, déclin, maintien tenu 1 s, relâche) avec une échelle de temps douce.
function drawEnvs() {
  [["cvFe", P.fe], ["cvAe", P.ae]].forEach(([id, e]) => { const cv = $(id); if (!cv) return;
    const w = cv.clientWidth * devicePixelRatio, hh = cv.clientHeight * devicePixelRatio; cv.width = w; cv.height = hh; const g = cv.getContext("2d");
    const sc = t => Math.sqrt(t), [a, d, s, r] = e, tot = sc(a) + sc(d * 1.5) + sc(0.6) + sc(r * 1.5), kx = (w - 12) / tot, y = v => hh - 6 - v * (hh - 12);
    let x = 6; g.strokeStyle = "#F5B342"; g.lineWidth = 2.5 * devicePixelRatio; g.fillStyle = "#F5B34222"; g.beginPath(); g.moveTo(x, y(0));
    x += sc(a) * kx; g.lineTo(x, y(1));

    x += sc(0.6) * kx; g.lineTo(x, y(s));

    g.lineTo(xr, y(0)); g.stroke(); g.lineTo(6, y(0)); g.fill(); });
}
// ---- annuler (30 pas)
const UNDO = [];
function snap() { UNDO.push(clone(P)); if (UNDO.length > 30) UNDO.shift(); }
function changed(full) { dirty = true; if (part) part.set(P); saveST(); renderHead(); if (full) renderPanel(); else drawEnvs(); }

$("panel").addEventListener("pointerdown", e => { if (e.target.matches("input[type=range]")) snap(); });
$("panel").addEventListener("input", e => { const el = e.target; if (!el.dataset.c) return; const c = CTLS[el.dataset.c]; const v = fromT(c, el.value / 1000);
  setP(c.path, v); el.style.setProperty("--p", el.value / 10 + "%"); const sp = document.querySelector(`[data-v="${c.path}"]`); if (sp) sp.textContent = c.fmt(v);
  changed(false); });
$("panel").addEventListener("change", e => { const el = e.target; if (el.dataset.c && /\.uni$/.test(el.dataset.c)) renderPanel(); });
$("panel").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.k) { snap(); const cur = getP(b.dataset.k), v = typeof cur === "number" ? +b.dataset.val : b.dataset.val; setP(b.dataset.k, v); changed(true); }
  else if (b.dataset.tog) { snap(); setP(b.dataset.tog, getP(b.dataset.tog) ? 0 : 1); changed(true); } });
$("tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (!b) return; ST.tab = b.dataset.tab; saveST(); renderTabs(); renderPanel(); $("panel").scrollTop = 0; });
$("undo").onclick = () => { if (!UNDO.length) return toast("Rien à annuler"); P = UNDO.pop(); changed(true); };
$("panic").onclick = () => { if (part) part.panic(); held.clear(); lightKeys(); };

// ---- varier : chaque réglage bouge un peu (±10 % de sa course), les formes d'onde parfois
$("vary").onclick = () => { snap(); renderPanelAll(c => { const t = toT(c, getP(c.path)) + (Math.random() * 2 - 1) * 0.1; setP(c.path, fromT(c, Math.max(0, Math.min(1, t)))); });
  if (Math.random() < 0.25) { const O = P.o[Math.floor(Math.random() * 3)]; if (O.on) O.w = WAVES[Math.floor(Math.random() * WAVES.length)]; }
  changed(true); toast("Variation (↶ pour revenir)"); preview(); };
// toutes les commandes de tous les onglets (pour varier)
function renderPanelAll(fn) { const t0 = ST.tab; const all = {};
  for (const [k] of TABS) { ST.tab = k; renderPanel(); Object.assign(all, CTLS); }
  ST.tab = t0; Object.values(all).filter(c => !/\.(oct|semi|uni)$|^bend$|^lvl$|^f\.cut$/.test(c.path)).forEach(fn); }

// ---- bibliothèque
const ORDER = () => [...Object.keys(SY.FACT), ...SY.mine().map(p => p.id)];
function load(id, quiet) { const p = SY.get(id); if (!p) return; snap(); P = clone(p); delete P.id; curId = id; dirty = false; if (part) { part.panic(); part.set(P); } saveST(); renderHead(); renderPanel(); if (!quiet) preview(); }
function step(d) { const L = ORDER(), i = L.indexOf(curId); load(L[(i + d + L.length) % L.length]); }
$("prev").onclick = () => step(-1); $("next").onclick = () => step(1);
$("pname").onclick = () => openLib();
$("lib").onclick = () => openLib();
let delArm = null;
function openLib() {
  const cats = [...new Set(Object.values(SY.FACT).map(p => p.cat))], mine = SY.mine();
  const pill = (id, n) => `<button class="pill ${id === curId ? "on" : ""}" data-load="${id}">${n}</button>`;
  $("libList").innerHTML = `<div class="lbl">MES SONS (${mine.length})</div>` +
    (mine.length ? mine.map(p => `<div class="mine">${pill(p.id, p.name + " <small style='opacity:.6'>· " + p.cat + "</small>")}<button class="pill sm" data-del="${p.id}">${delArm === p.id ? "Effacer ?" : "🗑"}</button></div>`).join("")
      : `<div class="lbl" style="letter-spacing:0">Aucun encore : règle un son puis « 💾 Garder ».</div>`) +
    cats.map(c => `<div class="lbl">${c.toUpperCase()}</div><div class="chips" style="gap:6px">${Object.entries(SY.FACT).filter(([, p]) => p.cat === c).map(([k, p]) => pill(k, p.name)).join("")}</div>`).join("") +
    `<div class="lbl">NOUVEAU</div><div class="chips"><button class="pill" data-init="1">Partir de zéro (une scie, filtre ouvert)</button></div>`;
  $("libBox").style.display = "flex";
}
$("libList").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.load) { delArm = null; load(b.dataset.load); $("libBox").style.display = "none"; }
  else if (b.dataset.del) { if (delArm !== b.dataset.del) { delArm = b.dataset.del; openLib(); return; }
    SY.saveMine(SY.mine().filter(p => p.id !== b.dataset.del)); delArm = null; mirror(); if (curId === b.dataset.del) { dirty = true; renderHead(); } openLib(); toast("Son effacé"); }
  else if (b.dataset.init) { snap(); P = SY.norm({ name: "Nouveau son", o: [{ on: 1, w: "saw" }], f: { t: "lp24", cut: 8000, env: 0 } }); curId = ""; dirty = true; changed(true); $("libBox").style.display = "none"; } });
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => b.closest(".ov").style.display = "none");
document.querySelectorAll(".ov").forEach(o => o.addEventListener("click", e => { if (e.target === o) o.style.display = "none"; }));

// ---- garder
const CATS = ["Nappes", "Cordes", "Cuivres", "Leads", "Basses", "Plucks", "Claviers", "Cloches", "Ambiances", "Mes sons"];
let sCat = null;
$("save").onclick = () => { const isMine = SY.mine().some(p => p.id === curId);
  $("sName").value = P.name + (!isMine && !dirty ? "" : !isMine ? " (à moi)" : ""); sCat = CATS.includes(P.cat) ? P.cat : "Mes sons";
  $("sCat").innerHTML = CATS.map(c => `<button data-cat="${c}" class="${c === sCat ? "on" : ""}">${c}</button>`).join("");
  $("sRep").style.display = isMine ? "" : "none"; $("sRepN").textContent = isMine ? (SY.get(curId) || {}).name : "";
  $("saveBox").style.display = "flex"; };
$("sCat").addEventListener("click", e => { const b = e.target.closest("[data-cat]"); if (!b) return; sCat = b.dataset.cat; $("sCat").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); });
function store(replace) { const name = $("sName").value.trim() || "Mon son"; const list = SY.mine();
  const rec = { ...clone(P), name, cat: sCat, id: replace ? curId : "u" + Date.now().toString(36) };
  if (replace) { const i = list.findIndex(p => p.id === curId); if (i >= 0) list[i] = rec; else list.push(rec); } else list.push(rec);
  SY.saveMine(list); P.name = name; P.cat = sCat; curId = rec.id; dirty = false; saveST(); renderHead(); mirror();
  $("saveBox").style.display = "none"; toast(replace ? "Son remplacé" : "Son gardé : il est dans Création"); }
$("sNew").onclick = () => store(false); $("sRep").onclick = () => store(true);
let toastT = null;
function toast(t) { const el = $("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toastT); toastT = setTimeout(() => el.style.display = "none", 1800); }

// ---- clavier (glisser d'une touche à l'autre ; la force vient de la hauteur du doigt sur la touche : bas = fort)
const held = new Map();      // note → poignée de note
const fingers = new Map();   // pointeur → note de base
const NAMES = ["Do", "Do♯", "Ré", "Ré♯", "Mi", "Fa", "Fa♯", "Sol", "Sol♯", "La", "La♯", "Si"];
function buildKb() {
  const kb = $("kb"), W = kb.clientWidth, nW = W < 520 ? 10 : W < 900 ? 15 : 22, ww = W / nW, base = 48 + 12 * ST.oct;
  const WH = [0, 2, 4, 5, 7, 9, 11]; let h = "";
  for (let i = 0; i < nW; i++) { const n = base + 12 * Math.floor(i / 7) + WH[i % 7];
    h += `<div class="k w" data-n="${n}" style="left:${i * ww}px;width:${ww - 1}px">${n % 12 === 0 ? `<i>Do${Math.floor(n / 12) - 1}</i>` : ""}</div>`;
    if ([0, 1, 3, 4, 5].includes(i % 7) && i < nW - 1) h += `<div class="k b" data-n="${n + 1}" style="left:${(i + 1) * ww - ww * 0.32}px;width:${ww * 0.64}px"></div>`; }
  kb.innerHTML = h; lightKeys();
}
const notesOf = n => ST.chord ? [n, n + 4, n + 7] : [n];
function keyAt(x, y) { const el = document.elementFromPoint(x, y); return el && el.closest("#kb .k"); }
function kOn(n, vel) { audio(); for (const m of notesOf(n)) { if (held.has(m)) { held.get(m).stop(); held.delete(m); } held.set(m, part.on(m, vel)); } lightKeys(); }
function kOff(n) { for (const m of notesOf(n)) { const h = held.get(m); if (h) { h.stop(); held.delete(m); } } lightKeys(); }
function lightKeys() { $("kb").querySelectorAll(".k").forEach(k => k.classList.toggle("on", held.has(+k.dataset.n))); }
const velOf = (k, y) => { const r = k.getBoundingClientRect(); return Math.max(0.2, Math.min(1, 0.3 + 0.75 * (y - r.top) / r.height)); };
$("kb").addEventListener("pointerdown", e => { e.preventDefault(); const k = keyAt(e.clientX, e.clientY); if (!k) return; const n = +k.dataset.n;
  $("kb").setPointerCapture(e.pointerId);
  if (ST.hold && held.has(n)) { kOff(n); fingers.set(e.pointerId, null); return; }
  fingers.set(e.pointerId, n); kOn(n, velOf(k, e.clientY)); });
$("kb").addEventListener("pointermove", e => { if (!fingers.has(e.pointerId)) return; const cur = fingers.get(e.pointerId); if (cur == null) return;
  const k = keyAt(e.clientX, e.clientY); if (!k) return; const n = +k.dataset.n; if (n === cur) return;
  if (!ST.hold) kOff(cur); fingers.set(e.pointerId, n); kOn(n, velOf(k, e.clientY)); });
const lift = e => { if (!fingers.has(e.pointerId)) return; const n = fingers.get(e.pointerId); fingers.delete(e.pointerId); if (n != null && !ST.hold) kOff(n); };
$("kb").addEventListener("pointerup", lift); $("kb").addEventListener("pointercancel", lift);
$("octD").onclick = () => { ST.oct = Math.max(-3, ST.oct - 1); saveST(); renderHead(); buildKb(); };
$("octU").onclick = () => { ST.oct = Math.min(3, ST.oct + 1); saveST(); renderHead(); buildKb(); };
$("hold").onclick = () => { ST.hold = !ST.hold; if (!ST.hold) { held.forEach(h => h.stop()); held.clear(); lightKeys(); } saveST(); renderHead(); };
$("chord").onclick = () => { ST.chord = !ST.chord; saveST(); renderHead(); };
const bend = $("bend"); bend.oninput = () => { if (part) part.bend(bend.value / 100); };
bend.onpointerup = bend.onpointercancel = () => { bend.value = 0; if (part) part.bend(0); };
// un aperçu quand on change de son : un accord (ou une note pour un son mono), une seconde
function preview() { audio(); const b = 60 + 12 * Math.min(0, ST.oct), ns = P.mode === "poly" ? [b, b + 4, b + 7] : [b];
  const hs = ns.map(n => part.on(n, 0.75)); setTimeout(() => hs.forEach(h => h.stop()), 1000); }

// ---- oscilloscope
function drawScope() { const cv = $("scope"), g = cv.getContext("2d"), buf = new Float32Array(an.fftSize);
  const fr = () => { const w = cv.width = cv.clientWidth * devicePixelRatio, h = cv.height = cv.clientHeight * devicePixelRatio;
    an.getFloatTimeDomainData(buf); let s = 0; while (s < 600 && !(buf[s] <= 0 && buf[s + 1] > 0)) s++;
    g.strokeStyle = "#5aa9ff"; g.lineWidth = 1.6 * devicePixelRatio; g.beginPath();
    for (let i = 0; i < 1024; i++) { const x = i / 1023 * w, y = h / 2 - buf[s + i] * h * 0.45; i ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke();
    requestAnimationFrame(fr); }; fr(); }

addEventListener("resize", () => { buildKb(); drawEnvs(); });
renderTabs(); renderHead(); renderPanel(); buildKb(); mirror();

</script>
</body></html>
